name: Apply Health Affiliate Store

on:
  push:
    branches:
      - health-affiliate-store

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-affiliate-store
          fetch-depth: 0

      - name: Wire Health store into production Health shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/CustomerHealth.jsx')
          text = page.read_text(encoding='utf-8')

          import_anchor = 'import HealthMobileQuickNav from "../components/customer-health/HealthMobileQuickNav";'
          store_import = 'import SyncWorksAffiliateStore from "../components/store/SyncWorksAffiliateStore";'
          if store_import not in text:
              if import_anchor not in text:
                  raise SystemExit('HealthMobileQuickNav import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + store_import, 1)

          render_anchor = '''          <SmartMealPlannerDrawer\n            open={'''
          store_render = '''          <SyncWorksAffiliateStore\n            open={drawer === "shop"}\n            onClose={() => setDrawer("")}\n            profile={profile}\n            snapshot={syncedSnapshot}\n            mode="health"\n          />\n\n'''
          if '<SyncWorksAffiliateStore' not in text:
              if render_anchor not in text:
                  raise SystemExit('SmartMealPlannerDrawer render anchor not found')
              text = text.replace(render_anchor, store_render + render_anchor, 1)

          page.write_text(text, encoding='utf-8')

          post = Path('src/components/customer-health/PostWorkoutCoachAssistant.jsx')
          post_text = post.read_text(encoding='utf-8')
          old = '''        <button type="button" onClick={() => setSupplementsOpen((value) => !value)} className="min-h-12 rounded-2xl border border-amber-300/20 bg-amber-300/[0.08] px-3 text-xs font-black text-amber-100">Supplements</button>'''
          new = '''        <button type="button" onClick={() => { if (typeof window !== "undefined") window.dispatchEvent(new CustomEvent("syncworks:health-open", { detail: { target: "shop", source: "post_workout" } })); }} className="min-h-12 rounded-2xl border border-amber-300/20 bg-amber-300/[0.08] px-3 text-xs font-black text-amber-100">Health Store</button>'''
          if old in post_text:
              post_text = post_text.replace(old, new, 1)
          post.write_text(post_text, encoding='utf-8')
          PY

      - name: Validate frontend
        shell: bash
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Remove temporary workflow and commit verified store
        shell: bash
        run: |
          rm .github/workflows/apply-health-affiliate-store.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerHealth.jsx src/components/customer-health/PostWorkoutCoachAssistant.jsx .github/workflows/apply-health-affiliate-store.yml
          git commit -m "Wire premium Health affiliate store"
          git push origin health-affiliate-store
