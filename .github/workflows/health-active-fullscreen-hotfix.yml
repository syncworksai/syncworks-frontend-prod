name: Health Active Workout Fullscreen Hotfix

on:
  push:
    branches: [health-workout-regression-hotfix]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-workout-regression-hotfix
          fetch-depth: 0
      - name: Force workout above app shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/customer-health/ActiveWorkoutSessionDrawer.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<div className="fixed inset-0 z-[90] bg-[#020403]">', '<div className="fixed inset-0 z-[1100] bg-[#020403]">', 1)
          text = text.replace('<section className="relative z-[91] flex h-[100dvh]', '<section className="relative z-[1101] flex h-[100dvh]', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
          git diff --check
      - name: Commit verified fullscreen fix
        run: |
          rm .github/workflows/health-active-fullscreen-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/ActiveWorkoutSessionDrawer.jsx .github/workflows/health-active-fullscreen-hotfix.yml
          git commit -m "Keep active Health workout above app shell"
          git push origin health-workout-regression-hotfix
