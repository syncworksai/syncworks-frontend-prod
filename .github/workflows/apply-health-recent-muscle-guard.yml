name: Apply Health Recent Muscle Guard

on:
  push:
    branches:
      - health-recent-muscle-guard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-recent-muscle-guard
          fetch-depth: 0

      - name: Add recovery-aware workout selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/customer-health/HealthDashboard.jsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
'''import {
  archiveExpiredCloudWorkout,
  loadCloudActiveWorkout,
} from "./healthWorkoutCloudSync";''',
'''import {
  archiveExpiredCloudWorkout,
  loadCloudActiveWorkout,
  loadCloudWorkoutHistory,
} from "./healthWorkoutCloudSync";''',
1)

          lifecycle_import = '''import {
  currentDayWorkout,
  formatHealthDay,
  localYmd,
  shouldOfferPreviousWorkout,
} from "./healthWorkoutDateLifecycle";'''
          if lifecycle_import not in text:
              raise SystemExit('lifecycle import anchor missing')
          text = text.replace(
              lifecycle_import,
              lifecycle_import + '\nimport { chooseRecoverySafeWorkout } from "./healthWorkoutRecoveryGuard";',
              1,
          )

          state_anchor = '''  const [screen, setScreen] = useState("dashboard");
  const [dayKey, setDayKey] = useState(() => localYmd());
  const [previousWorkout, setPreviousWorkout] = useState(null);'''
          state_new = '''  const [screen, setScreen] = useState("dashboard");
  const [dayKey, setDayKey] = useState(() => localYmd());
  const [previousWorkout, setPreviousWorkout] = useState(null);
  const [cloudHistory, setCloudHistory] = useState([]);'''
          if state_anchor not in text:
              raise SystemExit('state anchor missing')
          text = text.replace(state_anchor, state_new, 1)

          selection_anchor = '''  const next = todayWorkout || upcomingWorkout || null;
  const completed = history.filter((item) => item?.completed_at || item?.status === "Completed").length;
  const planPct = Math.max(12, Math.min(100, safeNumber(snapshot?.plan_completion_percent, completed ? 68 : 24)));
  const todayTitle = next?.workout_name || "Chest Push Focus";'''
          selection_new = '''  const next = todayWorkout || upcomingWorkout || null;
  const combinedHistory = [
    ...(Array.isArray(history) ? history : []),
    ...(Array.isArray(cloudHistory) ? cloudHistory : []),
  ];
  const recoveryCandidates = [...weekPlan]
    .filter((item) => item?.workout_name && !["Completed", "Skipped", "Rescheduled"].includes(item?.status))
    .filter((item) => String(item?.ymd || "") >= dayKey)
    .sort((a, b) => String(a?.ymd || "9999").localeCompare(String(b?.ymd || "9999")));
  const recoveryDecision = chooseRecoverySafeWorkout({
    proposedWorkout: next,
    candidates: recoveryCandidates,
    history: combinedHistory,
    today: dayKey,
  });
  const effectiveWorkout = recoveryDecision.workout || next;
  const completed = combinedHistory.filter((item) => item?.completed_at || item?.finished_at || item?.status === "Completed").length;
  const planPct = Math.max(12, Math.min(100, safeNumber(snapshot?.plan_completion_percent, completed ? 68 : 24)));
  const todayTitle = effectiveWorkout?.workout_name || "Choose Today's Workout";'''
          if selection_anchor not in text:
              raise SystemExit('selection anchor missing')
          text = text.replace(selection_anchor, selection_new, 1)

          try_anchor = '''      try {
        const active = await loadCloudActiveWorkout();'''
          try_new = '''      try {
        const cloud = await loadCloudWorkoutHistory();
        if (!cancelled) {
          setCloudHistory(
            Array.isArray(cloud?.results)
              ? cloud.results
              : Array.isArray(cloud)
              ? cloud
              : []
          );
        }
        const active = await loadCloudActiveWorkout();'''
          if try_anchor not in text:
              raise SystemExit('refresh anchor missing')
          text = text.replace(try_anchor, try_new, 1)

          card_anchor = '''                <section className="relative overflow-hidden rounded-[1.75rem] border border-blue-400/20 bg-[#07101e] p-5"><div className="text-[10px] font-black uppercase tracking-[.2em] text-blue-300">Today's Workout</div><h2 className="mt-2 text-2xl font-black">{todayTitle}</h2><p className="mt-1 text-sm text-slate-400">Upper body focus · adaptable for home or gym</p><div className="mt-5 grid grid-cols-3 gap-2 text-center"><div><div className="text-xl font-black">45</div><div className="text-[10px] text-slate-500">Minutes</div></div><div><div className="text-xl font-black">8</div><div className="text-[10px] text-slate-500">Exercises</div></div><div><div className="text-xl font-black">All</div><div className="text-[10px] text-slate-500">Levels</div></div></div><button type="button" onClick={() => setScreen("workouts")} className="mt-5 h-11 w-full rounded-xl bg-gradient-to-r from-cyan-400 via-blue-500 to-violet-600 text-sm font-black">Start Workout</button></section>'''
          card_new = '''                <section className="relative overflow-hidden rounded-[1.75rem] border border-blue-400/20 bg-[#07101e] p-5">
                  <div className="flex items-center justify-between gap-2">
                    <div className="text-[10px] font-black uppercase tracking-[.2em] text-blue-300">Today's Workout</div>
                    {recoveryDecision.revised ? <div className="rounded-full border border-lime-300/25 bg-lime-300/10 px-2.5 py-1 text-[9px] font-black uppercase tracking-[.12em] text-lime-200">AI revised plan</div> : null}
                  </div>
                  <h2 className="mt-2 text-2xl font-black">{todayTitle}</h2>
                  {recoveryDecision.revised ? (
                    <div className="mt-2 rounded-xl border border-lime-300/20 bg-lime-300/[0.06] p-3 text-xs leading-5 text-lime-100">
                      {recoveryDecision.reason}
                      {effectiveWorkout?.ai_revised_from_workout_name ? <div className="mt-1 text-[10px] text-slate-400">Originally scheduled: {effectiveWorkout.ai_revised_from_workout_name}</div> : null}
                    </div>
                  ) : <p className="mt-1 text-sm text-slate-400">Selected from your plan, recent training, and today's recovery needs.</p>}
                  <div className="mt-5 grid grid-cols-3 gap-2 text-center">
                    <div><div className="text-xl font-black">{safeNumber(effectiveWorkout?.duration_minutes, 45)}</div><div className="text-[10px] text-slate-500">Minutes</div></div>
                    <div><div className="text-xl font-black">{Array.isArray(effectiveWorkout?.exercises) ? effectiveWorkout.exercises.length : safeNumber(effectiveWorkout?.exercise_count, 0) || "-"}</div><div className="text-[10px] text-slate-500">Exercises</div></div>
                    <div><div className="text-xl font-black">AI</div><div className="text-[10px] text-slate-500">Recovery check</div></div>
                  </div>
                  <button
                    type="button"
                    onClick={() => recoveryDecision.needsRebuild ? onOpen?.("planner") : effectiveWorkout ? onStartWorkout?.(effectiveWorkout) : setScreen("workouts")}
                    className="mt-5 h-11 w-full rounded-xl bg-gradient-to-r from-cyan-400 via-blue-500 to-violet-600 text-sm font-black"
                  >
                    {recoveryDecision.needsRebuild ? "Build Recovery-Safe Workout" : recoveryDecision.revised ? "Start Revised Workout" : "Start Workout"}
                  </button>
                  <button type="button" onClick={() => setScreen("workouts")} className="mt-2 h-10 w-full rounded-xl border border-white/10 bg-white/[.03] text-xs font-black text-slate-300">View or change workout</button>
                </section>'''
          if card_anchor not in text:
              raise SystemExit('today workout card anchor missing')
          text = text.replace(card_anchor, card_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify production build
        shell: bash
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Remove workflow and commit verified build
        shell: bash
        run: |
          rm .github/workflows/apply-health-recent-muscle-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/HealthDashboard.jsx src/components/customer-health/healthWorkoutRecoveryGuard.js .github/workflows/apply-health-recent-muscle-guard.yml
          git commit -m "Prevent back to back muscle group workouts"
          git push origin health-recent-muscle-guard
