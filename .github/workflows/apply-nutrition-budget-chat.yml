name: Apply Nutrition Budget Chat

on:
  push:
    branches:
      - health-nutrition-budget-chat

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-nutrition-budget-chat
          fetch-depth: 0

      - name: Integrate practical Nutrition Coach chat
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/customer-health/NutritionCoachDrawer.jsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import api from "../../api/client";\n'
          replacement = import_anchor + 'import NutritionBudgetCoachChat from "./NutritionBudgetCoachChat";\n'
          if 'NutritionBudgetCoachChat' not in text:
              if import_anchor not in text:
                  raise SystemExit('API import anchor not found')
              text = text.replace(import_anchor, replacement, 1)

          card_anchor = '        <div className="mt-3 rounded-2xl border border-white/10 bg-white/[0.035] p-3 sm:mt-5 sm:rounded-[1.5rem] sm:p-4">\n          <label className="block">'
          chat_block = '''        <div className="mt-3 sm:mt-5">
          <NutritionBudgetCoachChat
            profile={profile}
            snapshot={snapshot}
            onUseSuggestion={(suggestion) => {
              setDescription(suggestion.description || "");
              setCalories(String(suggestion.calories || ""));
              setProtein(String(suggestion.protein || ""));
              setCarbs(String(suggestion.carbs || ""));
              setFat(String(suggestion.fat || ""));
              setEstimate({
                items: [],
                calories: safeNumber(suggestion.calories, 0),
                protein: safeNumber(suggestion.protein, 0),
                carbs: safeNumber(suggestion.carbs, 0),
                fat: safeNumber(suggestion.fat, 0),
                fiber: 0,
                sugar: 0,
                confidence: "coach suggestion",
                note: "Review restaurant portions, price, and preparation before saving.",
                provider: "nutrition_coach_chat",
              });
              setSavedMessage("");
              setAnalysisError("");
            }}
          />
        </div>

''' + card_anchor
          if 'onUseSuggestion={(suggestion)' not in text:
              if card_anchor not in text:
                  raise SystemExit('Meal description card anchor not found')
              text = text.replace(card_anchor, chat_block, 1)

          replacements = {
              'Ã¢Å“â€¢': 'Close',
              'Analyzing MealÃ¢â‚¬Â¦': 'Analyzing Meal...',
              'Saving MealÃ¢â‚¬Â¦': 'Saving Meal...',
              ' cal Ã‚/{" "}': ' cal ·{" "}',
              'g protein Ã‚/{" "}': 'g protein ·{" "}',
              'g carbs Ã‚/{" "}': 'g carbs ·{" "}',
              ' Ã‚/ ': ' · ',
              'Ã¢â‚¬Â¦': '...',
              'Ã¢â‚¬â€': '—',
              'Ã¢â‚¬â€œ': '–',
              'Â': '',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify build
        shell: bash
        run: |
          rm .github/workflows/apply-nutrition-budget-chat.yml
          npm ci
          npm run build
          git diff --check

      - name: Commit verified build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/NutritionCoachDrawer.jsx src/components/customer-health/NutritionBudgetCoachChat.jsx .github/workflows/apply-nutrition-budget-chat.yml
          git commit -m "Add practical Nutrition Coach chat"
          git push origin health-nutrition-budget-chat
