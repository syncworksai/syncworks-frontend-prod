name: Apply Health Mobile Profile Fix

on:
  push:
    branches:
      - health-mobile-profile-access-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-mobile-profile-access-fix
          fetch-depth: 0

      - name: Fix Health profile mobile access and gym builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/customer-health/HealthProfileIntakeDrawer.jsx')
          text = path.read_text(encoding='utf-8')

          # Keep the full-screen profile flow below the global iOS-safe ModeBar on mobile,
          # but above the global customer bottom navigation so Continue/Save can never be covered.
          text = text.replace(
              'className="fixed inset-0 z-[125] flex justify-end bg-black/80 backdrop-blur-xl"',
              'className="fixed inset-x-0 bottom-0 top-[115px] z-[400] flex justify-end bg-black/80 backdrop-blur-xl sm:inset-0"',
              1,
          )
          text = text.replace(
              'className="relative z-[126] flex h-full w-full max-w-4xl flex-col overflow-hidden border-l border-cyan-300/15',
              'className="relative z-[401] flex h-full w-full max-w-4xl flex-col overflow-hidden border-l border-cyan-300/15',
              1,
          )
          text = text.replace(
              'className="border-b border-white/10 px-4 py-4 sm:px-6"',
              'className="shrink-0 border-b border-white/10 px-3 py-3 sm:px-6 sm:py-4"',
              1,
          )
          text = text.replace(
              'className="mt-1 text-2xl font-black text-white sm:text-3xl"',
              'className="mt-1 text-xl font-black text-white sm:text-3xl"',
              1,
          )
          text = text.replace(
              'className="mt-2 max-w-2xl text-sm leading-6 text-slate-400"',
              'className="mt-1 max-w-2xl text-[11px] leading-4 text-slate-400 sm:mt-2 sm:text-sm sm:leading-6"',
              1,
          )
          text = text.replace(
              'className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4"',
              'className="mt-3 grid grid-cols-4 gap-1.5 sm:mt-4 sm:gap-2"',
              1,
          )
          text = text.replace(
              '"rounded-2xl border px-3 py-3 text-left transition",',
              '"min-h-12 rounded-xl border px-2 py-2 text-left transition sm:rounded-2xl sm:px-3 sm:py-3",',
              1,
          )
          text = text.replace(
              'className="mt-1 text-sm font-black"',
              'className="mt-0.5 text-[10px] font-black leading-3 sm:mt-1 sm:text-sm sm:leading-normal"',
              1,
          )
          text = text.replace(
              '"border-lime-300/20 bg-lime-300/[0.07] text-lime-100"',
              '"border-blue-300/20 bg-blue-300/[0.07] text-blue-100"',
          )
          text = text.replace(
              '<main className="flex-1 overflow-y-auto px-4 py-5 sm:px-6">',
              '<main className="min-h-0 flex-1 overflow-y-auto overscroll-contain px-3 py-3 pb-28 sm:px-6 sm:py-5 sm:pb-28">',
              1,
          )
          text = text.replace(
              '<footer className="border-t border-white/10 bg-[#040812]/95 px-4 py-3 sm:px-6">',
              '<footer className="sticky bottom-0 z-30 shrink-0 border-t border-cyan-300/15 bg-[#040812]/98 px-3 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] shadow-[0_-16px_38px_rgba(0,0,0,.45)] backdrop-blur-xl sm:px-6">',
              1,
          )
          text = text.replace(
              'className="h-12 rounded-2xl border border-lime-300/30 bg-lime-300/15 text-sm font-black text-lime-100 disabled:cursor-not-allowed disabled:opacity-40"',
              'className="h-12 rounded-2xl border border-cyan-300/35 bg-gradient-to-r from-cyan-500 to-blue-600 text-sm font-black text-white shadow-[0_8px_24px_rgba(37,99,235,.25)] disabled:cursor-not-allowed disabled:opacity-40"',
              1,
          )

          # Add a simple gym-equipment inventory that feeds the existing profile fields.
          equipment_constants = '''\nconst GYM_EQUIPMENT_OPTIONS = [\n  "Bodyweight",\n  "Dumbbells",\n  "Adjustable dumbbells",\n  "Barbell",\n  "Bench",\n  "Squat rack",\n  "Smith machine",\n  "Cable machine",\n  "Cable attachments",\n  "Lat pulldown",\n  "Seated row",\n  "Leg press",\n  "Leg extension",\n  "Leg curl",\n  "Chest press",\n  "Shoulder press",\n  "Pull-up bar",\n  "Resistance bands",\n  "Kettlebells",\n  "Treadmill",\n  "Stationary bike",\n  "Rowing machine",\n  "Elliptical",\n  "Stair climber",\n];\n\nfunction equipmentList(value) {\n  if (Array.isArray(value)) return value.filter(Boolean);\n  return String(value || "")\n    .split(",")\n    .map((item) => item.trim())\n    .filter(Boolean);\n}\n'''
          marker = 'function FieldLabel({ children }) {'
          if 'const GYM_EQUIPMENT_OPTIONS' not in text:
              if marker not in text:
                  raise SystemExit('FieldLabel marker missing')
              text = text.replace(marker, equipment_constants + '\n' + marker, 1)

          text = text.replace(
              '  const [confirmed, setConfirmed] =\n    useState(false);',
              '  const [confirmed, setConfirmed] =\n    useState(false);\n  const [gymBuilderOpen, setGymBuilderOpen] = useState(false);',
              1,
          )
          text = text.replace(
              '    setConfirmed(false);',
              '    setConfirmed(false);\n    setGymBuilderOpen(false);',
              1,
          )

          # Normalize profile data so gym selections survive older string-only profiles.
          old_equipment_init = '''      preferred_equipment:\n        profile?.preferred_equipment ||\n        "Bodyweight",'''
          new_equipment_init = '''      preferred_equipment:\n        profile?.preferred_equipment ||\n        (Array.isArray(profile?.available_equipment)\n          ? profile.available_equipment.join(", ")\n          : "Bodyweight"),'''
          if old_equipment_init in text:
              text = text.replace(old_equipment_init, new_equipment_init, 1)

          # Replace free-text location/equipment inputs with a location dropdown and Build Gym inventory.
          pattern = re.compile(
              r'''\s*<TextInput\s+label="Training location".*?/>\s*<TextInput\s+label="Available equipment".*?/>''',
              re.S,
          )
          replacement = '''\n                <div className="sm:col-span-2">\n                  <SelectField\n                    label="Training location"\n                    value={form.training_location || "Home"}\n                    onChange={(value) => {\n                      patch("training_location", value);\n                      if (["Gym", "Home Gym"].includes(value)) setGymBuilderOpen(true);\n                    }}\n                    options={["Home", "Home Gym", "Gym", "Outdoors", "Hotel / Travel", "Other"]}\n                  />\n\n                  <div className="mt-2 flex items-center gap-2">\n                    <button\n                      type="button"\n                      onClick={() => setGymBuilderOpen((current) => !current)}\n                      className="h-10 flex-1 rounded-xl border border-cyan-300/25 bg-cyan-300/[0.07] px-3 text-left text-[11px] font-black text-cyan-100"\n                    >\n                      {gymBuilderOpen ? "Hide Gym Builder" : "Build Gym / Equipment"}\n                    </button>\n                    <span className="text-[9px] font-bold text-slate-500">\n                      {equipmentList(form.preferred_equipment).length} selected\n                    </span>\n                  </div>\n\n                  {gymBuilderOpen ? (\n                    <div className="mt-2 rounded-2xl border border-blue-400/20 bg-blue-500/[0.05] p-3">\n                      <div className="text-[9px] font-black uppercase tracking-[0.14em] text-blue-300">Your equipment</div>\n                      <p className="mt-1 text-[10px] leading-4 text-slate-500">Tap everything available at this location. SYNC uses this inventory when building and swapping exercises.</p>\n                      <div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3">\n                        {GYM_EQUIPMENT_OPTIONS.map((item) => {\n                          const selected = equipmentList(form.preferred_equipment).includes(item);\n                          return (\n                            <button\n                              key={item}\n                              type="button"\n                              onClick={() => {\n                                const current = equipmentList(form.preferred_equipment);\n                                const next = selected\n                                  ? current.filter((entry) => entry !== item)\n                                  : [...current, item];\n                                patch("preferred_equipment", next.join(", "));\n                              }}\n                              className={cx(\n                                "min-h-10 rounded-xl border px-2 py-2 text-[10px] font-black",\n                                selected\n                                  ? "border-cyan-300/35 bg-cyan-300/12 text-cyan-100"\n                                  : "border-white/10 bg-white/[0.025] text-slate-400"\n                              )}\n                            >\n                              {item}\n                            </button>\n                          );\n                        })}\n                      </div>\n                      <label className="mt-3 block">\n                        <FieldLabel>Other equipment / attachments</FieldLabel>\n                        <input\n                          value={form.preferred_equipment || ""}\n                          onChange={(event) => patch("preferred_equipment", event.target.value)}\n                          placeholder="Add anything else, separated by commas"\n                          className="mt-2 h-10 w-full rounded-xl border border-white/10 bg-slate-950 px-3 text-[11px] font-bold text-white outline-none focus:border-cyan-300/40"\n                        />\n                      </label>\n                    </div>\n                  ) : (\n                    <div className="mt-2 truncate text-[10px] text-slate-500">\n                      {form.preferred_equipment || "No equipment selected yet"}\n                    </div>\n                  )}\n                </div>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'location/equipment block replacement count={count}')

          # Feed location and equipment into the live Health snapshot as well as the profile.
          snapshot_anchor = '''      audible_trainer_enabled:\n        (form.coach_audio_mode || "music_friendly") !==\n        "music_friendly",'''
          snapshot_replacement = '''      audible_trainer_enabled:\n        (form.coach_audio_mode || "music_friendly") !==\n        "music_friendly",\n      training_location: form.training_location || "Home",\n      available_equipment: equipmentList(form.preferred_equipment),\n      workout_equipment: equipmentList(form.preferred_equipment),\n      equipment: form.preferred_equipment || "Bodyweight",'''
          if snapshot_anchor not in text:
              raise SystemExit('snapshot save anchor missing')
          text = text.replace(snapshot_anchor, snapshot_replacement, 1)

          # Profile gets the normalized array too for future workout-location intelligence.
          profile_anchor = '''      profile_version: 1,'''
          if profile_anchor not in text:
              raise SystemExit('profile save anchor missing')
          text = text.replace(
              profile_anchor,
              '''      available_equipment: equipmentList(form.preferred_equipment),\n      profile_version: 1,''',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify frontend build
        shell: bash
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-health-mobile-profile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/HealthProfileIntakeDrawer.jsx .github/workflows/apply-health-mobile-profile-fix.yml
          git commit -m "Fix Health mobile profile access and gym setup"
          git push origin health-mobile-profile-access-fix
