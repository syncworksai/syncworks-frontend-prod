name: SYNC Assistant Frontend CI

on:
  pull_request:
    paths:
      - "src/api/jarvisProduct.js"
      - "src/components/sync/**"
      - "src/pages/CustomerDashboard.js"
      - "src/pages/CustomerDashboardV2.jsx"
      - "src/pages/SyncAssistantSetup.jsx"
      - "src/pages/Upgrade.js"
      - ".github/workflows/sync-assistant-frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
