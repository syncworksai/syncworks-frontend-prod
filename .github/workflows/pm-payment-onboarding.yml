name: PM payment setup frontend checks
on:
  pull_request:
    paths:
      - "src/pages/PMCollectionSetup.jsx"
      - "src/pages/PmSettings.jsx"
      - "src/components/pm/PMShell.jsx"
      - "src/App.jsx"
      - "package.json"
      - "scripts/check-pm-payment-onboarding.mjs"
      - ".github/workflows/pm-payment-onboarding.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
