name: Health Workout Regression Hotfix

on:
  push:
    branches: [health-workout-regression-hotfix]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-workout-regression-hotfix
          fetch-depth: 0
      - name: Apply hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/CustomerHealth.jsx')
          text = p.read_text(encoding='utf-8')
          old = '''    setActivePlannerItem({\n      ...plannerItem,\n      ...(currentPlannerItem || {}),\n    });'''
          new = '''    const mergedPlannerItem = {\n      ...plannerItem,\n      ...(currentPlannerItem || {}),\n    };\n\n    const hasEmbeddedExercises =\n      Array.isArray(mergedPlannerItem.exercises) &&\n      mergedPlannerItem.exercises.length > 0;\n\n    const matchingWorkout = !hasEmbeddedExercises\n      ? (Array.isArray(workouts) ? workouts : []).find((item) => {\n          const itemName = String(item?.workout_name || item?.name || item?.title || "").trim().toLowerCase();\n          const plannerName = String(mergedPlannerItem?.workout_name || mergedPlannerItem?.name || mergedPlannerItem?.title || "").trim().toLowerCase();\n          return (\n            (mergedPlannerItem?.workout_id && item?.id === mergedPlannerItem.workout_id) ||\n            (plannerName && itemName === plannerName)\n          );\n        })\n      : null;\n\n    let resolvedPlannerItem = hasEmbeddedExercises\n      ? mergedPlannerItem\n      : matchingWorkout && Array.isArray(matchingWorkout.exercises) && matchingWorkout.exercises.length\n      ? {\n          ...matchingWorkout,\n          ...mergedPlannerItem,\n          exercises: matchingWorkout.exercises,\n          workout_id: mergedPlannerItem.workout_id || matchingWorkout.id || "",\n          source: mergedPlannerItem.source || matchingWorkout.source || "planned_workout",\n        }\n      : mergedPlannerItem;\n\n    if (!Array.isArray(resolvedPlannerItem.exercises) || !resolvedPlannerItem.exercises.length) {\n      const fallbackPlan = buildAdaptiveWorkout({\n        history,\n        snapshot: syncedSnapshot,\n        profile,\n        mode: "recommended",\n      });\n\n      if (Array.isArray(fallbackPlan?.exercises) && fallbackPlan.exercises.length) {\n        resolvedPlannerItem = {\n          ...resolvedPlannerItem,\n          exercises: fallbackPlan.exercises,\n          requested_focus: resolvedPlannerItem.requested_focus || fallbackPlan.focus || "",\n          adaptive_focus: fallbackPlan.focus || resolvedPlannerItem.adaptive_focus || "",\n          adaptive_reason: "Restored missing exercise details from your current Health plan context.",\n          source: resolvedPlannerItem.source || "planner_rehydrated",\n        };\n      }\n    }\n\n    if (!Array.isArray(resolvedPlannerItem.exercises) || !resolvedPlannerItem.exercises.length) {\n      setDrawer("plan-today");\n      return;\n    }\n\n    setActivePlannerItem(resolvedPlannerItem);'''
          if old not in text:
              raise SystemExit('startPlannerWorkout anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('src/components/customer-health/WorkoutFocusLaunchDrawer.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('className="fixed inset-0 z-[260] overflow-y-auto bg-[#020617] text-white"', 'className="fixed inset-0 z-[1000] overflow-y-auto bg-[#020617] text-white"', 1)
          text = text.replace('pb-[calc(7.5rem+env(safe-area-inset-bottom))]', 'pb-[calc(5.25rem+env(safe-area-inset-bottom))]', 1)
          text = text.replace('className="fixed inset-x-0 bottom-0 z-[280]', 'className="fixed inset-x-0 bottom-0 z-[1020]', 1)
          text = text.replace('className="mt-1 text-xl font-black text-white">{firstExerciseName(workout)}</div>', 'className="mt-1 text-lg font-black text-white">{firstExerciseName(workout)}</div>', 1)
          text = text.replace('className="mt-3 grid grid-cols-3 gap-2"', 'className="mt-2 grid grid-cols-3 gap-1.5"', 1)
          text = text.replace('className="mt-3 rounded-2xl border border-white/10 bg-[#07101e] p-3"', 'className="mt-2 rounded-2xl border border-white/10 bg-[#07101e] p-3"', 1)
          text = text.replace('onClick={startWorkout}\n              disabled={started}', 'onClick={startWorkout}\n              disabled={started || totals.exercises === 0}', 1)
          text = text.replace('{started ? "Entering Workout..." : "Start Workout"}', '{totals.exercises === 0 ? "Restoring Plan..." : started ? "Entering Workout..." : "Start Workout"}', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('src/components/navigation/RoleAwareMobileNav.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('center?.sync ? <strong>S</strong> : <img src="/brand/syncworks-start-logo.png" alt="" />', '<img src="/brand/syncworks-start-logo.png" alt="" />', 1)
          text = text.replace('center.sync ? <strong>S</strong> : <img src="/brand/syncworks-start-logo.png" alt="" />', '<img src="/brand/syncworks-start-logo.png" alt="" />', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('src/components/navigation/RoleAwareMobileNav.css')
          text = p.read_text(encoding='utf-8')
          text = text.replace('padding:.5rem .45rem .42rem', 'padding:.38rem .4rem .34rem', 1)
          text = text.replace('min-height:3.8rem', 'min-height:3.25rem', 1)
          text = text.replace('transform:translateY(-.86rem)', 'transform:translateY(-.58rem)', 1)
          text = text.replace('width:4.55rem;height:4.55rem', 'width:3.7rem;height:3.7rem', 1)
          text = text.replace('width:3.55rem;height:3.55rem', 'width:3rem;height:3rem', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
          git diff --check
      - name: Commit verified hotfix
        run: |
          rm .github/workflows/health-workout-regression-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerHealth.jsx src/components/customer-health/WorkoutFocusLaunchDrawer.jsx src/components/navigation/RoleAwareMobileNav.jsx src/components/navigation/RoleAwareMobileNav.css .github/workflows/health-workout-regression-hotfix.yml
          git commit -m "Fix Health workout mobile regression"
          git push origin health-workout-regression-hotfix
