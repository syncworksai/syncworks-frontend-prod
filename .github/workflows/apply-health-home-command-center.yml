name: Apply Health Home Command Center

on:
  push:
    branches:
      - health-home-command-center-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-home-command-center-v2
          fetch-depth: 0

      - name: Tighten active workout shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/customer-health/WorkoutFocusCompactPanel.jsx')
          text = path.read_text(encoding='utf-8')
          old = '''    [
      "Previous Workout + Progression",
      "Personal Records",
      "Next Record Targets",
      "Milestones Reached",
      "Coach Voice Settings",
      "Live Set Board",
      "Finish Check-In",
    ].forEach((marker) => {
      [...root.querySelectorAll("div, section, details")]
        .filter((element) => (element.textContent || "").includes(marker))
        .slice(0, 1)
        .forEach(hide);
    });'''
          new = '''    [
      "Dynamic Warmup",
      "Previous Workout + Progression",
      "Personal Records",
      "Next Record Targets",
      "Milestones Reached",
      "Coach Voice Settings",
      "Live Set Board",
      "Finish Check-In",
      "Progress the load",
      "Recommended target",
    ].forEach((marker) => {
      const match = [...root.querySelectorAll("div, section, details")]
        .filter((element) => element !== panel && !element.contains(panel))
        .filter((element) => (element.textContent || "").includes(marker))
        .sort((a, b) => (a.textContent || "").length - (b.textContent || "").length)[0];
      if (match) hide(match);
    });'''
          if old not in text:
              raise SystemExit('Workout focus marker block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify build
        shell: bash
        run: |
          rm .github/workflows/apply-health-home-command-center.yml
          npm ci
          npm run build
          git diff --check

      - name: Commit verified build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/WorkoutFocusCompactPanel.jsx .github/workflows/apply-health-home-command-center.yml
          git commit -m "Tighten Health workout command center"
          git push origin health-home-command-center-v2
