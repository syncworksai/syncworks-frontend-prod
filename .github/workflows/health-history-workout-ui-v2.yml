name: Health History Recovery and Workout UI v2

on:
  push:
    branches: [health-history-workout-ui-v2]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-history-workout-ui-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch Health recovery and workout mobile UX
        run: |
          python - <<'PY'
          from pathlib import Path

          customer = Path('src/pages/CustomerHealth.jsx')
          text = customer.read_text()

          anchor = 'import { buildHealthAchievements } from "../components/customer-health/healthAchievements";\n'
          addition = anchor + 'import { loadCloudWorkoutHistory } from "../components/customer-health/healthWorkoutCloudSync";\nimport {\n  buildExerciseMemoryFromHistory,\n  readExerciseMemory,\n  writeExerciseMemory,\n} from "../components/customer-health/healthExerciseMemory";\n'
          if 'loadCloudWorkoutHistory' not in text:
              text = text.replace(anchor, addition)

          old = '''        const data =\n          await getCustomerHealthProfile();\n\n        if (!mounted) return;'''
          new = '''        const data =\n          await getCustomerHealthProfile();\n\n        const workoutHistoryResponse =\n          await loadCloudWorkoutHistory().catch((error) => {\n            console.warn(\n              "Health workout history recovery endpoint unavailable.",\n              error\n            );\n            return null;\n          });\n\n        if (!mounted) return;'''
          if old not in text:
              raise SystemExit('CustomerHealth cloud load anchor missing')
          text = text.replace(old, new, 1)

          old = '''        const historyMerge =\n          mergeHealthHistory({\n            localHistory,\n            cloudHistory:\n              Array.isArray(\n                data?.history_json\n              )\n                ? data.history_json\n                : [],\n          });'''
          new = '''        const endpointHistory =\n          Array.isArray(workoutHistoryResponse?.results)\n            ? workoutHistoryResponse.results\n            : [];\n\n        const profileHistory =\n          Array.isArray(data?.history_json)\n            ? data.history_json\n            : [];\n\n        const historyMerge =\n          mergeHealthHistory({\n            localHistory,\n            cloudHistory: [\n              ...endpointHistory,\n              ...profileHistory,\n            ],\n          });'''
          if old not in text:
              raise SystemExit('CustomerHealth history merge anchor missing')
          text = text.replace(old, new, 1)

          old = '''        setHistory(cloudHistory);\n\n        writeJson(\n          HISTORY_KEY,\n          cloudHistory\n        );'''
          new = '''        setHistory(cloudHistory);\n\n        const recoveredExerciseMemory =\n          buildExerciseMemoryFromHistory(\n            cloudHistory,\n            readExerciseMemory()\n          );\n        writeExerciseMemory(recoveredExerciseMemory);\n\n        writeJson(\n          HISTORY_KEY,\n          cloudHistory\n        );'''
          if old not in text:
              raise SystemExit('CustomerHealth setHistory anchor missing')
          text = text.replace(old, new, 1)
          customer.write_text(text)

          active = Path('src/components/customer-health/ActiveWorkoutSessionDrawer.jsx')
          text = active.read_text()

          anchor = '''  useEffect(() => {\n    latestSessionRef.current = session;\n  }, [session]);\n'''
          addition = anchor + '''\n  useEffect(() => {\n    if (\n      !open ||\n      !session ||\n      !Array.isArray(history) ||\n      !history.length\n    ) {\n      return;\n    }\n\n    setSession((previous) => {\n      if (!previous) return previous;\n\n      const hydrated =\n        hydrateSessionWithExerciseMemory({\n          session: previous,\n          history,\n        });\n\n      return sanitizeLegacyWorkoutData(hydrated);\n    });\n  }, [open, history]);\n'''
          if 'const hydrated =\n        hydrateSessionWithExerciseMemory' not in text:
              if anchor not in text:
                  raise SystemExit('ActiveWorkout session ref anchor missing')
              text = text.replace(anchor, addition, 1)

          old = '<div className="fixed inset-0 z-[1100] bg-[#020403]">\n<section className="relative z-[1101] flex h-[100dvh] w-full flex-col overflow-hidden bg-[radial-gradient(circle_at_50%_-10%,rgba(0,245,106,0.12),transparent_30%),linear-gradient(180deg,#050806_0%,#020403_100%)]">'
          new = '<div className="health-active-workout-root fixed inset-0 z-[1100] bg-[#020617]">\n<section className="health-active-workout-shell relative z-[1101] flex h-[100dvh] w-full flex-col overflow-hidden bg-[radial-gradient(circle_at_50%_-10%,rgba(34,211,238,0.12),transparent_30%),linear-gradient(180deg,#050816_0%,#020617_100%)]">'
          if old not in text:
              raise SystemExit('ActiveWorkout root anchor missing')
          text = text.replace(old, new, 1)

          text = text.replace('className="sticky top-0 z-30 border-b border-emerald-300/15 bg-[#030604]/97 px-3 py-3 backdrop-blur-xl sm:px-6 sm:py-4"', 'className="health-active-workout-header sticky top-0 z-30 border-b border-cyan-300/15 bg-[#020617]/97 px-3 py-2 backdrop-blur-xl sm:px-6 sm:py-4"', 1)
          text = text.replace('text-emerald-200 sm:text-xs', 'text-cyan-200 sm:text-xs', 1)
          text = text.replace('className="mt-1 truncate text-xl font-black text-white sm:text-4xl"', 'className="mt-0.5 truncate text-lg font-black text-white sm:text-4xl"', 1)
          text = text.replace('className="mt-2 flex flex-wrap items-center gap-2"', 'className="mt-1 flex flex-wrap items-center gap-2"', 1)
          text = text.replace('border-emerald-300/20 bg-emerald-300/10 px-3 py-1 text-[9px] font-black uppercase tracking-[0.12em] text-emerald-100', 'border-cyan-300/20 bg-cyan-300/10 px-2 py-0.5 text-[8px] font-black uppercase tracking-[0.12em] text-cyan-100', 1)
          text = text.replace('className="mt-3 grid grid-cols-4 gap-1.5 sm:hidden"', 'className="mt-2 grid grid-cols-4 gap-1 sm:hidden"', 1)
          text = text.replace('className="mx-auto w-full max-w-5xl flex-1 overflow-y-auto px-3 py-3 pb-[calc(12rem+env(safe-area-inset-bottom))] sm:px-6 sm:py-5 sm:pb-40"', 'className="health-active-workout-main mx-auto w-full max-w-5xl flex-1 overflow-y-auto px-2.5 py-2.5 pb-[calc(7.2rem+env(safe-area-inset-bottom))] sm:px-6 sm:py-5 sm:pb-40"', 1)
          active.write_text(text)

          panel = Path('src/components/customer-health/WorkoutFocusCompactPanel.jsx')
          text = panel.read_text()

          old = '  const previousSets = currentExercise?.previous_working_sets || currentExercise?.last_working_sets || currentExercise?.exercise_memory?.working_sets || [];'
          new = '  const previousSets = currentExercise?.previous_performance?.last_sets || currentExercise?.previous_working_sets || currentExercise?.last_working_sets || currentExercise?.exercise_memory?.working_sets || [];'
          if old not in text:
              raise SystemExit('Compact panel previous set anchor missing')
          text = text.replace(old, new, 1)

          replacements = {
            'border border-lime-300/25 bg-[radial-gradient(circle_at_88%_0%,rgba(57,255,136,0.11),transparent_28%),linear-gradient(160deg,#0a120d,#020403)]': 'border border-cyan-300/25 bg-[radial-gradient(circle_at_88%_0%,rgba(34,211,238,0.10),transparent_28%),linear-gradient(160deg,#07101f,#020617)]',
            'text-lime-300">Active workout': 'text-cyan-300">Active workout',
            'bg-lime-300" style={{ width: `${workoutProgress.percent}%` }}': 'bg-gradient-to-r from-cyan-400 to-blue-600" style={{ width: `${workoutProgress.percent}%` }}',
            'className="p-3 pb-28 sm:p-4 sm:pb-32"': 'className="p-2.5 pb-24 sm:p-4 sm:pb-32"',
            'className="mt-1 truncate text-2xl font-black text-white"': 'className="mt-0.5 truncate text-xl font-black text-white"',
            'className="mt-3 block h-44 w-full overflow-hidden': 'className="mt-2 block h-36 w-full overflow-hidden',
            'className="mt-3 grid grid-cols-3 gap-2"': 'className="mt-2 grid grid-cols-3 gap-1.5"',
            'className="rounded-2xl border border-white/10 bg-black/25 p-3 text-center"': 'className="rounded-xl border border-white/10 bg-black/25 p-2 text-center"',
            'className="rounded-2xl border border-cyan-300/20 bg-cyan-300/[0.06] p-3 text-center"': 'className="rounded-xl border border-cyan-300/20 bg-cyan-300/[0.06] p-2 text-center"',
            'className="mt-3 grid grid-cols-3 gap-2"><button': 'className="mt-2 grid grid-cols-3 gap-1.5"><button',
            'border border-lime-300/20 bg-[#020604]/96': 'border border-cyan-300/20 bg-[#020617]/96',
            'border-lime-300/45 bg-lime-300 text-sm font-black uppercase tracking-[0.08em] text-black shadow-[0_0_24px_rgba(57,255,136,0.30)]': 'border-cyan-300/45 bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-600 text-sm font-black uppercase tracking-[0.08em] text-white shadow-[0_0_24px_rgba(34,211,238,0.24)]',
          }
          for a,b in replacements.items():
              text = text.replace(a,b)

          text = text.replace('<div className="fixed inset-x-0 bottom-0 z-[210]', '<div className="health-workout-action-dock fixed inset-x-0 bottom-0 z-[210]', 1)
          text = text.replace('grid max-w-xl grid-cols-[72px_1fr_72px] gap-2', 'grid max-w-xl grid-cols-[64px_1fr_64px] gap-1.5', 1)
          text = text.replace('className={`h-14 rounded-2xl', 'className={`h-12 rounded-xl', 1)
          text = text.replace('className="h-14 rounded-2xl border border-lime-300/45', 'className="h-12 rounded-xl border border-cyan-300/45', 1)
          text = text.replace('className="h-14 rounded-2xl border border-fuchsia-300/25', 'className="h-12 rounded-xl border border-fuchsia-300/25', 1)
          panel.write_text(text)

          css = Path('src/components/customer-health/healthWorkoutMobileV2.css')
          css.write_text('''@media (max-width: 639px) {\n  .health-active-workout-root { background:#020617 !important; }\n  .health-active-workout-header { padding-top:max(.5rem,env(safe-area-inset-top)); }\n  .health-active-workout-main { scrollbar-width:none; }\n  .health-active-workout-main::-webkit-scrollbar { display:none; }\n  .health-active-workout-root #health-workout-command-center { border-radius:1.15rem; }\n  .health-active-workout-root .health-workout-action-dock { padding-left:.55rem; padding-right:.55rem; padding-top:.4rem; padding-bottom:max(.45rem,env(safe-area-inset-bottom)); }\n}\n''')

          customer = Path('src/pages/CustomerHealth.jsx')
          text = customer.read_text()
          import_anchor = 'import "../components/customer-health/healthObsidianElectric.css";\n'
          if 'healthWorkoutMobileV2.css' not in text:
              text = text.replace(import_anchor, import_anchor + 'import "../components/customer-health/healthWorkoutMobileV2.css";\n')
          customer.write_text(text)
          PY
      - name: Static recovery assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const customer = fs.readFileSync('src/pages/CustomerHealth.jsx','utf8');
          const active = fs.readFileSync('src/components/customer-health/ActiveWorkoutSessionDrawer.jsx','utf8');
          const panel = fs.readFileSync('src/components/customer-health/WorkoutFocusCompactPanel.jsx','utf8');
          const checks = [
            ['cloud workout history recovery', customer.includes('loadCloudWorkoutHistory') && customer.includes('endpointHistory')],
            ['exercise memory rebuild', customer.includes('buildExerciseMemoryFromHistory') && customer.includes('writeExerciseMemory(recoveredExerciseMemory)')],
            ['active session history rehydrate', active.includes('hydrateSessionWithExerciseMemory') && active.includes('}, [open, history]);')],
            ['visible previous sets', panel.includes('previous_performance?.last_sets')],
            ['compact workout dock', panel.includes('health-workout-action-dock')],
          ];
          const failed = checks.filter(([,ok]) => !ok);
          for (const [name,ok] of checks) console.log(`${ok ? 'PASS' : 'FAIL'} ${name}`);
          if (failed.length) process.exit(1);
          NODE
      - run: npm run build
      - run: git diff --check
      - name: Commit verified build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/health-history-workout-ui-v2.yml
          git add src/pages/CustomerHealth.jsx src/components/customer-health/ActiveWorkoutSessionDrawer.jsx src/components/customer-health/WorkoutFocusCompactPanel.jsx src/components/customer-health/healthWorkoutMobileV2.css
          git commit -m "Restore Health workout history and refine mobile workout UI"
          git push origin HEAD:health-history-workout-ui-v2
