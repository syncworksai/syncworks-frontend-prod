name: Apple CarPlay

on:
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple-carplay.yml"
  workflow_dispatch:

jobs:
  build-carplay-host:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build iPhone and CarPlay host
        working-directory: apple
        run: >-
          xcodebuild
          -project SyncWorksApple.xcodeproj
          -scheme SyncWorksApple
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
