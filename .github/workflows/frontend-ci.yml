name: SyncWorks Frontend CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/syncworks-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -n 40 /tmp/syncworks-build.log | while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done
            exit "$code"
          fi
