name: SyncWorks Frontend CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/syncworks-build.log 2>&1
          code=$?
          cat /tmp/syncworks-build.log
          if [ "$code" -ne 0 ]; then
            message=$(tail -n 80 /tmp/syncworks-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-7000)
            echo "::error title=Frontend build failed::$message"
            exit "$code"
          fi
