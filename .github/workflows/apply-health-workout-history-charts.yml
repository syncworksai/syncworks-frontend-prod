name: Apply Health Workout History Charts

on:
  push:
    branches:
      - health-workout-history-charts

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-workout-history-charts
          fetch-depth: 0

      - name: Wire cloud workout persistence and history charts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path('src/components/customer-health/PostWorkoutReportCard.jsx')
          text = report.read_text(encoding='utf-8')
          import_anchor = 'import { formatSeconds } from "./healthWorkoutSession";'
          if 'WorkoutHistoryProgressCard' not in text:
              if import_anchor not in text:
                  raise SystemExit('report import anchor missing')
              text = text.replace(import_anchor, import_anchor + '\nimport WorkoutHistoryProgressCard from "./WorkoutHistoryProgressCard";', 1)

          insert_anchor = '''      <button\n        type="button"\n        onClick={() => setShowProgression((current) => !current)}'''
          if '<WorkoutHistoryProgressCard session={session} />' not in text:
              if insert_anchor not in text:
                  raise SystemExit('report chart insert anchor missing')
              text = text.replace(
                  insert_anchor,
                  '''      <div className="mt-3">\n        <WorkoutHistoryProgressCard session={session} />\n      </div>\n\n''' + insert_anchor,
                  1,
              )
          report.write_text(text, encoding='utf-8')

          active = Path('src/components/customer-health/ActiveWorkoutSessionDrawer.jsx')
          text = active.read_text(encoding='utf-8')

          import_anchor = '''import {\n  playWorkoutCoachMessage,\n  stopWorkoutCoachAudio,\n} from "./healthWorkoutAudioController";'''
          cloud_import = '''import {\n  clearCloudActiveWorkout,\n  cloudWorkoutMatchesPlanner,\n  flushCloudActiveWorkoutSave,\n  loadCloudActiveWorkout,\n  queueCloudActiveWorkoutSave,\n  saveCompletedWorkoutToCloud,\n} from "./healthWorkoutCloudSync";'''
          if 'from "./healthWorkoutCloudSync"' not in text:
              if import_anchor not in text:
                  raise SystemExit('active import anchor missing')
              text = text.replace(import_anchor, import_anchor + '\n' + cloud_import, 1)

          persist_anchor = '''    if (session.status === "active") {\n      persistWorkoutSession(\n        session,\n        plannerItem\n      );\n      return;\n    }'''
          persist_new = '''    if (session.status === "active") {\n      persistWorkoutSession(\n        session,\n        plannerItem\n      );\n      queueCloudActiveWorkoutSave(session, plannerItem);\n      return;\n    }'''
          if 'queueCloudActiveWorkoutSave(session, plannerItem);' not in text:
              if persist_anchor not in text:
                  raise SystemExit('active persist anchor missing')
              text = text.replace(persist_anchor, persist_new, 1)

          init_effect_anchor = '''  useEffect(() => {\n    if (\n      !open ||\n      !session ||\n      session.status !== "active"\n    ) {'''
          cloud_effect = '''  useEffect(() => {\n    if (!open || !plannerItem) return undefined;\n\n    let cancelled = false;\n\n    loadCloudActiveWorkout()\n      .then((activeWorkout) => {\n        if (\n          cancelled ||\n          !activeWorkout?.session ||\n          activeWorkout.session.status !== "active" ||\n          !cloudWorkoutMatchesPlanner(activeWorkout, plannerItem)\n        ) {\n          return;\n        }\n\n        const localPersisted = readPersistedWorkout();\n        if (persistedSessionHasProgress(localPersisted)) return;\n\n        const restored = restorePersistedSession({\n          session: activeWorkout.session,\n          persisted_at: activeWorkout.saved_at,\n        });\n\n        if (!restored) return;\n\n        setSession(\n          sanitizeLegacyWorkoutData(\n            hydrateSessionWithExerciseMemory({\n              session: ensureDynamicPreparation(restored, snapshot || {}),\n              history,\n            })\n          )\n        );\n        setFinishMessage(\n          `Workout restored from SYNC Cloud at exercise ${\n            Number(restored.current_exercise_index || 0) + 1\n          } of ${restored.exercises?.length || 0}.`\n        );\n      })\n      .catch((error) => {\n        console.warn("Health cloud workout restore unavailable.", error);\n      });\n\n    return () => {\n      cancelled = true;\n    };\n  }, [open, plannerItem?.id]);\n\n'''
          if 'Workout restored from SYNC Cloud' not in text:
              if init_effect_anchor not in text:
                  raise SystemExit('cloud restore effect anchor missing')
              text = text.replace(init_effect_anchor, cloud_effect + init_effect_anchor, 1)

          visibility_anchor = '''        persistWorkoutSession(\n          latestSessionRef.current,\n          plannerItem\n        );\n\n        return;'''
          visibility_new = '''        persistWorkoutSession(\n          latestSessionRef.current,\n          plannerItem\n        );\n        flushCloudActiveWorkoutSave(\n          latestSessionRef.current,\n          plannerItem\n        ).catch(() => undefined);\n\n        return;'''
          if 'flushCloudActiveWorkoutSave(\n          latestSessionRef.current' not in text:
              if visibility_anchor not in text:
                  raise SystemExit('visibility anchor missing')
              text = text.replace(visibility_anchor, visibility_new, 1)

          pagehide_anchor = '''    function handlePageHide() {\n      persistWorkoutSession(\n        latestSessionRef.current,\n        plannerItem\n      );\n    }'''
          pagehide_new = '''    function handlePageHide() {\n      persistWorkoutSession(\n        latestSessionRef.current,\n        plannerItem\n      );\n      flushCloudActiveWorkoutSave(\n        latestSessionRef.current,\n        plannerItem\n      ).catch(() => undefined);\n    }'''
          if pagehide_new not in text:
              if pagehide_anchor not in text:
                  raise SystemExit('pagehide anchor missing')
              text = text.replace(pagehide_anchor, pagehide_new, 1)

          finished_anchor = '''      const nextHistory = (\n        Array.isArray(result.nextHistory)'''
          cloud_complete = '''      saveCompletedWorkoutToCloud(finishedSession)\n        .then((cloudResult) => {\n          if (Array.isArray(cloudResult?.session ? [cloudResult.session] : [])) {\n            setFinishMessage((current) =>\n              `${current || "Workout saved."} SYNC Cloud history updated.`\n            );\n          }\n        })\n        .catch((error) => {\n          console.warn("Completed workout cloud save failed.", error);\n          setFinishMessage((current) =>\n            `${current || "Workout saved locally."} Cloud sync will retry next time.`\n          );\n        });\n      clearCloudActiveWorkout().catch(() => undefined);\n\n'''
          if 'saveCompletedWorkoutToCloud(finishedSession)' not in text:
              if finished_anchor not in text:
                  raise SystemExit('completed cloud save anchor missing')
              text = text.replace(finished_anchor, cloud_complete + finished_anchor, 1)

          edit_anchor = '''    setHistory?.(result.nextHistory);\n    setSnapshot?.(nextSnapshot);\n    setSession(result.editedSession);'''
          edit_new = '''    setHistory?.(result.nextHistory);\n    setSnapshot?.(nextSnapshot);\n    setSession(result.editedSession);\n    saveCompletedWorkoutToCloud(result.editedSession).catch((error) => {\n      console.warn("Edited workout cloud save failed.", error);\n    });'''
          if 'Edited workout cloud save failed.' not in text:
              if edit_anchor not in text:
                  raise SystemExit('edited save anchor missing')
              text = text.replace(edit_anchor, edit_new, 1)

          active.write_text(text, encoding='utf-8')
          PY

      - name: Verify production build
        shell: bash
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Remove workflow and commit verified build
        shell: bash
        run: |
          rm .github/workflows/apply-health-workout-history-charts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/ActiveWorkoutSessionDrawer.jsx src/components/customer-health/PostWorkoutReportCard.jsx .github/workflows/apply-health-workout-history-charts.yml
          git commit -m "Wire Health cloud workouts and progress charts"
          git push origin health-workout-history-charts
