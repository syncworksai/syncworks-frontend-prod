name: Apply Health Workout UX Rescue v3

on:
  push:
    branches:
      - health-workout-ux-rescue-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: health-workout-ux-rescue-v3
          fetch-depth: 0

      - name: Patch active workout shell
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_health.py
          python /tmp/patch_health.py

      - name: Verify production build
        shell: bash
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-health-workout-ux-rescue-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer-health/ActiveWorkoutSessionDrawer.jsx src/index.css .github/workflows/apply-health-workout-ux-rescue-v3.yml
          git commit -m "Rewire Health workout to single command center"
          git push origin health-workout-ux-rescue-v3
